<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打卡系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAEEF2; --card:#FFFFFF; --ink:#161D26; --muted:#697585;
    --line:#DBE1E8; --line-2:#EEF1F5;
    --brand:#274B78; --brand-ink:#1B3557;
    --in:#1C7A50; --in-soft:#E3F3EB;
    --out:#B4400C; --out-soft:#FBEADF;
    --amber:#E8A62B;
    --shadow:0 1px 2px rgba(22,29,38,.06),0 8px 24px rgba(22,29,38,.06);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Inter','Noto Sans TC',system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans); background:var(--paper); color:var(--ink);
    line-height:1.5; -webkit-font-smoothing:antialiased;
    padding:18px; max-width:960px; margin:0 auto;
  }
  a{color:var(--brand)}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}

  header.app{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .logo{
    width:40px;height:40px;border-radius:11px;flex:none;
    background:linear-gradient(150deg,var(--brand),var(--brand-ink));
    display:grid;place-items:center;color:#fff;box-shadow:var(--shadow);
  }
  .logo svg{width:22px;height:22px}

  nav.tabs{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:14px;
    box-shadow:var(--shadow);margin-bottom:18px;overflow-x:auto}
  nav.tabs button{
    flex:1;min-width:max-content;border:0;background:transparent;color:var(--muted);
    font-family:inherit;font-size:14px;font-weight:600;padding:9px 12px;border-radius:9px;
    cursor:pointer;white-space:nowrap;transition:.15s;
  }
  nav.tabs button.active{background:var(--brand);color:#fff}
  nav.tabs button:not(.active):hover{background:var(--line-2);color:var(--ink)}

  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .card h2 .tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--line-2);
    padding:3px 8px;border-radius:20px;letter-spacing:0}

  label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
  input,select{
    width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;transition:.15s;
  }
  input:focus,select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(39,75,120,.12)}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .field{min-width:0}
  @media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}

  .btn{font-family:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);
    background:#fff;color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--line-2)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-ink)}
  .btn.ghost-danger{color:var(--out);border-color:var(--out-soft);background:var(--out-soft)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---- Clock hero ---- */
  .clock-wrap{text-align:center;padding:6px 0 4px}
  .clock-date{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .clock-time{font-family:var(--mono);font-weight:700;font-size:clamp(44px,13vw,76px);
    letter-spacing:-.02em;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}
  .clock-time .sec{color:var(--brand);font-size:.5em;vertical-align:.28em;margin-left:.1em}

  .punch-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .punch{border:0;border-radius:15px;padding:20px 12px;cursor:pointer;font-family:inherit;
    font-weight:700;font-size:19px;color:#fff;transition:transform .12s,filter .15s;display:flex;
    flex-direction:column;align-items:center;gap:4px}
  .punch small{font-weight:500;font-size:12px;opacity:.85;letter-spacing:.04em}
  .punch.in{background:linear-gradient(160deg,#25976a,var(--in))}
  .punch.out{background:linear-gradient(160deg,#d05a1e,var(--out))}
  .punch:active{transform:scale(.97)}
  .punch:hover{filter:brightness(1.05)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
  .punch.pop{animation:pop .3s}

  /* ---- table ---- */
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
  th{background:#FBF3EA;color:var(--brand-ink);font-weight:700;font-size:12px;position:sticky;top:0}
  tbody tr:hover{background:var(--line-2)}
  td.mono,th.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .pill.in{background:var(--in-soft);color:var(--in)}
  .pill.out{background:var(--out-soft);color:var(--out)}
  .icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;padding:3px 6px;border-radius:6px}
  .icon-btn:hover{background:var(--out-soft);color:var(--out)}

  .roster-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
    border-radius:11px;margin-bottom:8px}
  .roster-item .avatar{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .roster-item .meta{flex:1;min-width:0}
  .roster-item .meta b{font-size:14px}
  .roster-item .meta span{display:block;font-size:12px;color:var(--muted)}

  .row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .count-badge{font-family:var(--mono);font-weight:700;color:var(--brand)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .checks{display:flex;flex-wrap:wrap;gap:8px}
  .chk{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;font-size:13px;font-weight:500;cursor:pointer;user-select:none}
  .chk input{width:auto}
  .chk.on{border-color:var(--brand);background:rgba(39,75,120,.06)}

  .switch{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;cursor:pointer}
  .switch input{width:auto;accent-color:var(--brand)}

  .empty{text-align:center;color:var(--muted);padding:34px 12px;font-size:13px}

  /* toast */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;z-index:50;
    display:flex;align-items:center;gap:9px;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
  #toast.ok .dot{background:#3ad089}

  .view{display:none}
  .view.active{display:block}
  .loading{padding:40px;text-align:center;color:var(--muted)}
</style>

<header class="app">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
  </div>
  <div>
    <h1>打卡系統</h1>
    <div class="sub">即時打卡、批次產生紀錄，一鍵匯出成昇億打卡紀錄格式</div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-v="punch" class="active">打卡</button>
  <button data-v="batch">批次產生</button>
  <button data-v="records">紀錄與匯出</button>
  <button data-v="roster">員工名單</button>
</nav>

<div id="app"><div class="loading">載入中…</div></div>

<!-- ============ PUNCH ============ -->
<template id="tpl-punch">
<div class="view" data-view="punch">
  <div class="card">
    <div class="clock-wrap">
      <div class="clock-date" id="clkDate">—</div>
      <div class="clock-time" id="clkTime">--:--<span class="sec">--</span></div>
    </div>
  </div>
  <div class="card">
    <h2>誰要打卡</h2>
    <div class="grid g2">
      <div class="field">
        <label class="f">員工</label>
        <select id="pEmp"></select>
      </div>
      <div class="field">
        <label class="f">班別</label>
        <select id="pShift">
          <option>固定班</option><option>早班</option><option>午班</option><option>晚班</option><option>大夜班</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-top:12px">
      <label class="f">打卡地點（GPS 關閉時使用）</label>
      <input id="pLoc" placeholder="例如：台北辦公室">
    </div>
    <div class="field" style="margin-top:12px">
      <label class="f">指定打卡縣市（選了就直接用該縣市的 GPS 座標）</label>
      <select id="pCity"></select>
    </div>
    <label class="switch" style="margin-top:12px"><input type="checkbox" id="pGps" checked> 使用 GPS 定位打卡（未指定縣市時才生效）</label>
    <div class="hint" id="pGpsStatus">開啟後，按下打卡會擷取此裝置的 GPS 座標，需允許瀏覽器定位權限。</div>
    <div class="punch-row">
      <button class="punch in" id="btnIn">上班<small>CLOCK IN</small></button>
      <button class="punch out" id="btnOut">下班<small>CLOCK OUT</small></button>
    </div>
  </div>
  <div class="card">
    <h2>今日紀錄 <span class="tag" id="todayCount">0 筆</span></h2>
    <div id="todayList"></div>
  </div>
</div>
</template>

<!-- ============ BATCH ============ -->
<template id="tpl-batch">
<div class="view" data-view="batch">
  <div class="card">
    <h2>選擇員工 <span class="tag">可複選</span>
      <button class="btn" id="bToggleAll" style="margin-left:auto;font-size:12px;padding:5px 10px">全部勾選</button></h2>
    <div class="checks" id="bEmps"></div>
    <div class="hint" id="bEmpHint">未選擇則不產生任何紀錄。到「員工名單」新增員工。</div>
  </div>
  <div class="card">
    <h2>日期與時間</h2>
    <div class="grid g2">
      <div class="field"><label class="f">開始日期</label><input type="date" id="bStart"></div>
      <div class="field"><label class="f">結束日期</label><input type="date" id="bEnd"></div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="field"><label class="f">上班時間</label><input type="time" id="bIn" value="09:00"></div>
      <div class="field"><label class="f">下班時間</label><input type="time" id="bOut" value="18:00"></div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="field"><label class="f">打卡地點（留白則用員工預設）</label><input id="bLoc" placeholder="沿用員工預設地點"></div>
      <div class="field"><label class="f">班別（留白則用員工預設）</label><input id="bShift" placeholder="沿用員工預設班別"></div>
    </div>
    <div class="field" style="margin-top:12px">
      <label class="f">GPS 座標（選填，格式：經度,緯度）— 填了就用 GPS 打卡並每筆微調</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="bGps" placeholder="例如：120.539104,23.509710">
        <select id="bCity" style="width:auto;flex:none"></select>
      </div>
    </div>
    <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
      <label class="switch"><input type="checkbox" id="bWeekday" checked> 只產生平日（跳過週六、週日）</label>
      <label class="switch"><input type="checkbox" id="bByHours"> 下班時間 = 上班時間 + 各員工「每日時數」（未設定者用上方下班時間）</label>
      <div class="switch"><input type="checkbox" id="bJitter"> 時間加入隨機誤差 ±
        <input type="number" id="bJitAmt" value="10" min="0" style="width:72px;margin:0 6px">
        <select id="bJitUnit" style="width:auto"><option>分鐘</option><option>小時</option></select></div>
    </div>
  </div>
  <div class="card">
    <div class="row-actions" style="margin-top:0;justify-content:space-between">
      <div>預計產生 <span class="count-badge" id="bPreview">0</span> 筆紀錄</div>
      <button class="btn primary" id="bGen">產生並加入紀錄</button>
    </div>
    <div class="hint">每位員工每天會產生一筆「上班」和一筆「下班」。</div>
  </div>
</div>
</template>

<!-- ============ RECORDS ============ -->
<template id="tpl-records">
<div class="view" data-view="records">
  <div class="card">
    <h2>所有紀錄 <span class="tag" id="recCount">0 筆</span></h2>
    <div class="row-actions" style="margin-top:0">
      <button class="btn primary" id="expXlsx">匯出 Excel（打卡之星匯入格式）</button>
      <button class="btn primary" id="expLog">匯出 Excel（月報表留存）</button>
      <button class="btn primary" id="expByDept">依部門分別匯出</button>
      <button class="btn" id="expCsv">匯出 CSV</button>
      <button class="btn ghost-danger" id="clearAll">清空全部</button>
    </div>
    <div class="hint">「打卡之星匯入格式」為 7 欄、每筆一列，供匯入打卡之星系統；「月報表留存」為昇億雙工作表報表，供每月存檔。GPS 座標會放在打卡地點欄。</div>
  </div>
  <div class="card">
    <h2>匯入打卡紀錄 <span class="tag">Excel</span></h2>
    <div class="hint" style="margin-top:0">上傳打卡資料檔載入到系統（會取代目前紀錄），支援 7 欄匯入範本格式或昇億 Log／打卡紀錄格式。打卡地點若為「GPS (經度，緯度)」會自動辨識為 GPS。</div>
    <div class="row-actions">
      <button class="btn primary" id="impRecBtn">選擇檔案匯入</button>
      <input type="file" id="impRecFile" accept=".xlsx,.xls,.csv" style="display:none">
    </div>
  </div>
  <div class="card">
    <div id="recTableWrap"></div>
  </div>
</div>
</template>

<!-- ============ ROSTER ============ -->
<template id="tpl-roster">
<div class="view" data-view="roster">
  <div class="card">
    <h2 id="rFormTitle">新增員工</h2>
    <div class="grid g2">
      <div class="field"><label class="f">員工編號 *</label><input id="rId" placeholder="例如：sales001"></div>
      <div class="field"><label class="f">姓名 *</label><input id="rName" placeholder="例如：劉秉志"></div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="field"><label class="f">部門</label><input id="rDept" placeholder="例如：凡圖滋"></div>
      <div class="field"><label class="f">預設打卡地點</label><input id="rLoc" placeholder="例如：台北辦公室"></div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="field"><label class="f">預設 GPS 座標（經度,緯度）</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="rGps" placeholder="例如：120.539104,23.509710">
          <select id="rCity" style="width:auto;flex:none"></select>
        </div>
      </div>
      <div class="field"><label class="f">預設班別</label>
        <select id="rShift"><option>固定班</option><option>早班</option><option>午班</option><option>晚班</option><option>大夜班</option></select>
      </div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="field"><label class="f">每日上班時數（小時）</label><input id="rHours" type="number" min="0" step="0.5" placeholder="例如：8"></div>
      <div class="field"></div>
    </div>
    <div class="row-actions">
      <button class="btn primary" id="rAdd">加入名單</button>
      <button class="btn" id="rCancel" style="display:none">取消編輯</button>
    </div>
  </div>
  <div class="card">
    <h2>匯入名單 <span class="tag">Excel / CSV</span></h2>
    <div class="hint" style="margin-top:0">從檔案匯入員工名單（會取代目前名單）。可辨識欄位：員工編號、姓名、部門、打卡地點、GPS、班別。名單只存在你這台裝置的瀏覽器，不會寫進網頁原始碼。</div>
    <div class="row-actions">
      <button class="btn primary" id="rImportBtn">選擇檔案匯入</button>
      <input type="file" id="rImportFile" accept=".xlsx,.xls,.csv" style="display:none">
    </div>
  </div>
  <div class="card">
    <h2>目前名單 <span class="tag" id="rosterCount">0 人</span></h2>
    <div id="rosterList"></div>
  </div>
</div>
</template>

<div id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
/* ---------- header labels: EXACT match to the import template ---------- */
const HEADERS = [
  "員工編號* (必填)",
  "姓名",
  "打卡日期* (必填)\nyyyy/mm/dd",
  "打卡時間* (必填)\nhh:mm",
  "類別* (必填)\n上班、下班",
  "打卡地點* (必填)",
  "班別 (非必填)\n如未填寫，則預設為固定班",
];

/* ---------- state ---------- */
let roster = [];   // {id,name,dept,loc,gps,shift}
let editingId = null;

/* ---------- 台灣各縣市市中心 GPS（經度,緯度） ---------- */
const TW_CITIES=[
  ['臺北市',121.5637,25.0375],['新北市',121.4657,25.0128],['基隆市',121.7419,25.1310],
  ['桃園市',121.3009,24.9937],['新竹市',120.9647,24.8039],['新竹縣',121.0132,24.8390],
  ['苗栗縣',120.8203,24.5651],['臺中市',120.6469,24.1616],['彰化縣',120.5445,24.0755],
  ['南投縣',120.6853,23.9099],['雲林縣',120.5417,23.7559],['嘉義市',120.4491,23.4801],
  ['嘉義縣',120.2555,23.4518],['臺南市',120.2270,22.9999],['高雄市',120.3014,22.6273],
  ['屏東縣',120.4880,22.6690],['宜蘭縣',121.7378,24.7021],['花蓮縣',121.6015,23.9910],
  ['臺東縣',121.1444,22.7583],['澎湖縣',119.5793,23.5712],['金門縣',118.3171,24.4340],
  ['連江縣',119.9497,26.1597]
];
function cityOptions(ph){ return `<option value="">${ph}</option>`+TW_CITIES.map(c=>`<option value="${c[0]}">${c[0]}</option>`).join(''); }
function cityLngLat(name){ const c=TW_CITIES.find(x=>x[0]===name); return c?{lng:c[1],lat:c[2]}:null; }

let records = [];  // {rid,empId,name,date,time,cat,loc,shift}
let currentView = 'punch';

/* ---------- 預設名單（由名單.xlsx 匯入） ---------- */
const DEFAULT_ROSTER = [];  // 已清空，名單改由「匯入名單」載入，不寫進公開原始碼


/* ---------- storage helpers (localStorage — works on any static host or local file) ---------- */
function loadAll(){
  try{ const r = localStorage.getItem('dk_roster'); if(r) roster = JSON.parse(r); }catch(e){}
  try{ const r = localStorage.getItem('dk_records'); if(r) records = JSON.parse(r); }catch(e){}
  if(!roster.length){

/* ---------- GPS helpers ---------- */
function gpsString(lng,lat){ return 'GPS ('+lng+'，'+lat+')'; }   // 經度在前、緯度在後、全形逗號（比照昇億範例）
function getGPS(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      ()=>resolve(null),
      {enableHighAccuracy:true,timeout:8000,maximumAge:0});
  });
}
function mapsLink(lat,lng,label){ return `<a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" rel="noopener">${label}</a>`; }
function locDisplay(r){
  if(r.method==='GPS' && r.lat!=null && r.lng!=null)
    return mapsLink(r.lat,r.lng,`GPS (${(+r.lng).toFixed(6)}，${(+r.lat).toFixed(6)})`);
  return r.loc||'—';
}

async function punch(cat,btnId){
  const emp=document.getElementById('pEmp'); const r=roster.find(x=>x.id===emp.value);
  if(!r){ toast('請先選擇員工'); return; }
  const b=document.getElementById(btnId);
  let method='手動', lat=null, lng=null, loc=document.getElementById('pLoc').value.trim()||r.loc||'';
  const city=cityLngLat(document.getElementById('pCity').value);
  if(city){
    lng=city.lng+(Math.random()-.5)*0.006; lat=city.lat+(Math.random()-.5)*0.006;
    method='GPS'; loc=gpsString(lng,lat);
    document.getElementById('pGpsStatus').textContent='已使用「'+document.getElementById('pCity').value+'」的 GPS 座標';
  } else if(document.getElementById('pGps').checked){
    const st=document.getElementById('pGpsStatus'), prev=st.textContent;
    st.textContent='定位中…請稍候'; b.disabled=true;
    const g=await getGPS(); b.disabled=false;
    if(g){ method='GPS'; lat=g.lat; lng=g.lng; loc=gpsString(lng,lat);
      st.textContent='已取得座標 · 精確度約 '+Math.round(g.acc)+' 公尺'; }
    else{
      const def=parseGps(r.gps);
      if(def){ method='GPS'; lat=def.lat; lng=def.lng; loc=gpsString(lng,lat);
        st.textContent='無法即時定位，已改用員工預設 GPS 座標'; toast('已改用員工預設 GPS 座標',true); }
      else{ st.textContent=prev; toast('無法取得 GPS，此員工也沒有預設 GPS，改用文字地點'); }
    }
  }
  const now=new Date();
  records.push({rid:uid(),empId:r.id,name:r.name,date:fmtDate(now),time:fmtTime(now),
    cat, loc, method, lat, lng, shift:document.getElementById('pShift').value});
  await saveRecords();
  b.classList.add('pop'); setTimeout(()=>b.classList.remove('pop'),300);
  toast(`${r.name} ${cat} · ${fmtTime(now)}${method==='GPS'?' · 已定位':''}`,true);
  renderToday();
}
function renderToday(){
  const today=fmtDate(new Date());
  const list=records.filter(r=>r.date===today).slice().reverse();
  document.getElementById('todayCount').textContent=list.length+' 筆';

/* ===== BATCH ===== */
function renderBatch(){
  const box=document.getElementById('bEmps');
  box.innerHTML=roster.map(r=>`<label class="chk"><input type="checkbox" value="${r.id}">${r.name}<span style="color:var(--muted)">${r.id}</span></label>`).join('')
    || '<span class="hint">尚無員工，請先到「員工名單」新增。</span>';
  const toggle=document.getElementById('bToggleAll');
  function syncToggle(){
    const boxes=[...document.querySelectorAll('#bEmps input')];
    const allOn=boxes.length>0 && boxes.every(c=>c.checked);
    if(toggle) toggle.textContent=allOn?'全部取消':'全部勾選';
  }
  box.querySelectorAll('input').forEach(c=>c.addEventListener('change',()=>{
    c.closest('.chk').classList.toggle('on',c.checked); syncToggle(); updatePreview();
  }));
  if(toggle) toggle.onclick=()=>{
    const boxes=[...document.querySelectorAll('#bEmps input')];
    const turnOn=!(boxes.length>0 && boxes.every(c=>c.checked));
    boxes.forEach(c=>{ c.checked=turnOn; c.closest('.chk').classList.toggle('on',turnOn); });
    syncToggle(); updatePreview();
  };
  syncToggle();
  const t=new Date(); const s=new Date(t.getFullYear(),t.getMonth(),1);
  document.getElementById('bStart').value=s.toISOString().slice(0,10);
  document.getElementById('bEnd').value=t.toISOString().slice(0,10);
  ['bStart','bEnd','bWeekday'].forEach(id=>document.getElementById(id).addEventListener('change',updatePreview));
  const bCity=document.getElementById('bCity');
  if(bCity){
    bCity.innerHTML=cityOptions('縣市帶入…');
    bCity.onchange=()=>{ const c=cityLngLat(bCity.value); if(c){ document.getElementById('bGps').value=c.lng+','+c.lat; updatePreview(); } };
  }
  document.getElementById('bGen').onclick=genBatch;
  updatePreview();
}
function selectedEmpIds(){ return [...document.querySelectorAll('#bEmps input:checked')].map(c=>c.value); }
function eachDay(cb){
  const s=new Date(document.getElementById('bStart').value);
  const e=new Date(document.getElementById('bEnd').value);
  const wkOnly=document.getElementById('bWeekday').checked;
  if(isNaN(s)||isNaN(e)||e<s) return;
  for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)){
    const wd=d.getDay(); if(wkOnly&&(wd===0||wd===6)) continue;
    cb(new Date(d));
  }
}
function countDays(){ let n=0; eachDay(()=>n++); return n; }
function updatePreview(){
  const n=selectedEmpIds().length*countDays()*2;
  document.getElementById('bPreview').textContent=n;
  document.getElementById('bGen').disabled=n===0;
}
function addMinutes(hhmm, mins){
  const [h,m]=hhmm.split(':').map(Number);
  let total=((h*60+m+Math.round(mins))%1440+1440)%1440;
  return pad(Math.floor(total/60))+':'+pad(total%60);
}
function jitter(hhmm){
  const amt=parseFloat(document.getElementById('bJitAmt').value)||0;
  const maxMin=Math.round(amt*(document.getElementById('bJitUnit').value==='小時'?60:1));
  if(maxMin<=0) return hhmm;
  return addMinutes(hhmm, Math.floor(Math.random()*(2*maxMin+1))-maxMin);
}
function parseGps(str){
  const m=(str||'').trim().match(/(-?\d+(?:\.\d+)?)\s*[，,]\s*(-?\d+(?:\.\d+)?)/);
  return m ? {lng:parseFloat(m[1]),lat:parseFloat(m[2])} : null;
}
async function genBatch(){
  const ids=selectedEmpIds(); if(!ids.length){ toast('請先選擇員工'); return; }
  const inT=document.getElementById('bIn').value, outT=document.getElementById('bOut').value;
  const locOv=document.getElementById('bLoc').value.trim(), shiftOv=document.getElementById('bShift').value.trim();
  const jit=document.getElementById('bJitter').checked;
  const base=parseGps(document.getElementById('bGps').value);
  const rec=(ds,t,cat,r)=>{
    const sh=shiftOv||r.shift||'固定班';
    const g=base||parseGps(r.gps);
    if(g){
      const lat=g.lat+(Math.random()-.5)*0.001, lng=g.lng+(Math.random()-.5)*0.001;
      return {rid:uid(),empId:r.id,name:r.name,date:ds,time:t,cat,loc:gpsString(lng,lat),method:'GPS',lat,lng,shift:sh};
    }
    return {rid:uid(),empId:r.id,name:r.name,date:ds,time:t,cat,loc:locOv||r.loc||'',method:'手動',lat:null,lng:null,shift:sh};
  };
  const byHours=document.getElementById('bByHours').checked;
  let added=0;
  eachDay(d=>{
    const ds=fmtDate(d);
    ids.forEach(id=>{
      const r=roster.find(x=>x.id===id); if(!r) return;
      const tin=jit?jitter(inT):inT;
      const hrs=parseFloat(r.hours);
      const tout=(byHours && hrs>0) ? addMinutes(tin, hrs*60) : (jit?jitter(outT):outT);
      records.push(rec(ds,tin,'上班',r));
      records.push(rec(ds,tout,'下班',r));
      added+=2;
    });
  });
  await saveRecords();
  toast(`已產生 ${added} 筆紀錄`,true);
}

function deptOf(empId){ const r=roster.find(x=>x.id===empId); return (r&&r.dept)||''; }

// 打卡紀錄工作表（30 欄，上/下班併同一列；打卡地點分列於第 20、24 欄）
const PIVOT_HEADERS = ["員工編號","姓名","部門","打卡日期","日期類別","班別",
  "表定上班時間","表定下班時間","休息時間","表定工時","打卡工時","計薪基準工時",
  "上班打卡時間","遲到","下班打卡時間","早退","出勤異常","提早上班原因",
  "上班打卡方式","上班打卡地點","上班地點異常，不在範圍內的原因","上班打卡設備","上班打卡設備異常",
  "延後下班原因","下班打卡方式","下班打卡地點","下班地點異常，不在範圍內的原因","下班打卡設備","下班打卡設備異常",
  "請假時間","請假時數","假別","加班時間","加班時數"];
function buildPivotAOA(recs){
  const D='--', map=new Map();
  sortRecords(recs).forEach(r=>{
    const k=r.empId+'|'+r.date;
    let g=map.get(k);
    if(!g){ g={empId:r.empId,name:r.name,date:r.date,shift:r.shift||'固定班',in:null,out:null}; map.set(k,g); }
    if(r.shift) g.shift=r.shift;
    if(r.cat==='上班'){ if(!g.in || r.time<g.in.time) g.in=r; }
    else { if(!g.out || r.time>g.out.time) g.out=r; }
  });
  const groups=[...map.values()].sort((a,b)=> (a.empId+a.date)<(b.empId+b.date)?-1:1);
  const DEV='mobile(Apple, iOS, Line)';
  const aoa=[PIVOT_HEADERS];
  groups.forEach(g=>{
    const i=g.in, o=g.out;
    const worked=(i&&o)?durationHMS(i.time,o.time):D;
    aoa.push([
      g.empId, g.name, deptOf(g.empId), g.date, RPT_DATECAT, RPT_SHIFT,
      D, D, D, D, worked, D,
      i?i.time:D, '', o?o.time:D, '', '', i?RPT_EARLY:D,
      i?(i.method||'手動'):D, i?(i.loc||D):D, D, i?DEV:D, D,
      D, o?(o.method||'手動'):D, o?(o.loc||D):D, D, o?DEV:D, D,
      D, D, D, D, D
    ]);
  });
  return aoa;
}

// Log 紀錄工作表（17 欄，每次打卡一列）
const LOG_HEADERS = ["員工編號","姓名","部門","打卡日期","日期類別","班別",
  "上班打卡時間","下班打卡時間","紀錄備註","提早上班原因",
  "上班打卡方式","上班打卡地點","上班地點異常，不在範圍內的原因","上班打卡設備","上班打卡設備異常",
  "延後下班原因","下班打卡方式","下班打卡地點","下班地點異常，不在範圍內的原因","下班打卡設備","下班打卡設備異常"];
const RPT_DATECAT='排班人員休假日', RPT_SHIFT='業務', RPT_EARLY='其他私人原因';
function buildLogAOA(recs){
  const D='--', DEV='mobile(Apple, iOS, Line)', aoa=[LOG_HEADERS];
  sortRecords(recs).forEach(r=>{
    const isIn=r.cat==='上班', m=r.method==='GPS'?'GPS/業務':(r.method||'手動'), loc=r.loc||'';
    aoa.push([
      r.empId, r.name, deptOf(r.empId), r.date, RPT_DATECAT, RPT_SHIFT,
      isIn?r.time:D, isIn?D:r.time, '', isIn?RPT_EARLY:D,
      isIn?m:D, isIn?loc:D, D, isIn?DEV:D, D,
      D, isIn?D:m, isIn?D:loc, D, isIn?D:DEV, D
    ]);

  return aoa;
}
function dateRange(recs){
  const ds=sortRecords(recs).map(r=>r.date);
  return ds.length?(ds[0]+'-'+ds[ds.length-1]).replace(/\//g,'.'):'';
}
function durationHMS(t1,t2){
  const [h1,m1]=t1.split(':').map(Number),[h2,m2]=t2.split(':').map(Number);
  let mm=(h2*60+m2)-(h1*60+m1); if(mm<0) mm+=1440;
  return pad(Math.floor(mm/60))+':'+pad(mm%60)+':00';
}
const STAT_HEADERS=["員工編號","姓名","部門","統計開始日","統計結束日","排班天數","上班天數","表定總工時","打卡總工時","計薪基準總工時","請假天數","請假總時數","遲到、早退、曠職天數","遲到總分鐘數","早退總分鐘數","曠職總分鐘數","加班總時數","員工到職日","離職最後工作日","特休該月到期時數","補休該月到期時數"];
function buildStatsAOA(recs){
  const D='--';
  const ds=sortRecords(recs).map(r=>r.date);
  const start=ds.length?ds[0]:'', end=ds.length?ds[ds.length-1]:'';
  const byEmp=new Map();
  sortRecords(recs).forEach(r=>{
    let e=byEmp.get(r.empId);
    if(!e){ e={empId:r.empId,name:r.name,days:new Map()}; byEmp.set(r.empId,e); }
    let day=e.days.get(r.date); if(!day){ day={in:null,out:null}; e.days.set(r.date,day); }
    if(r.cat==='上班'){ if(!day.in||r.time<day.in) day.in=r.time; }
    else { if(!day.out||r.time>day.out) day.out=r.time; }
  });
  const aoa=[STAT_HEADERS];
  [...byEmp.values()].sort((a,b)=>a.empId<b.empId?-1:1).forEach(e=>{
    let workDays=0, totalMin=0;
    e.days.forEach(day=>{
      if(day.in||day.out) workDays++;
      if(day.in&&day.out){ const [h1,m1]=day.in.split(':').map(Number),[h2,m2]=day.out.split(':').map(Number); let mm=(h2*60+m2)-(h1*60+m1); if(mm<0)mm+=1440; totalMin+=mm; }
    });
    const th=pad(Math.floor(totalMin/60))+':'+pad(totalMin%60)+':00';
    aoa.push([e.empId,e.name,deptOf(e.empId),start,end,D,workDays,D,th,D,D,D,D,D,D,D,D,D,D,D,D]);
  });
  return aoa;
}
const _CG='FFD9D9D9', _CB='FFC9DAF8', _CN='FFD9EAD3', _CP='FFFFCCCC';
const COLOR_LOG=[_CG,_CG,_CG,_CG,_CG,_CG,_CB,_CN,_CG,_CB,_CB,_CB,_CB,_CB,_CB,_CN,_CN,_CN,_CN,_CN,_CN];
const COLOR_PIVOT=[_CG,_CG,_CG,_CG,_CG,_CG,_CG,_CG,_CG,_CG,_CG,_CG,_CB,_CB,_CN,_CN,_CG,_CB,_CB,_CB,_CB,_CB,_CB,_CN,_CN,_CN,_CN,_CN,_CN,_CP,_CP,_CP,_CP,_CP];
const COLOR_STAT=Array(21).fill(_CG);
function colorHeader(ws,colors){
  const bd={style:'thin',color:{rgb:'FFBBBBBB'}};
  colors.forEach((rgb,c)=>{
    const ref=XLSX.utils.encode_cell({r:0,c});
    if(ws[ref]) ws[ref].s={ fill:{patternType:'solid',fgColor:{rgb}},
      alignment:{horizontal:'center',vertical:'center',wrapText:true},
      border:{top:bd,bottom:bd,left:bd,right:bd} };
  });
}
function buildWorkbook(recs){
  const range=dateRange(recs);
  const wcol=(n,wide)=>Array.from({length:n},(_,i)=>({wch:wide.includes(i)?36:12}));
  const nm=(base)=>{ const full='【'+range+'_'+base+'】'; return full.length>31?base:full; };
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet(buildLogAOA(recs));   ws1['!cols']=wcol(21,[11,17]); colorHeader(ws1,COLOR_LOG);   XLSX.utils.book_append_sheet(wb,ws1,nm('Log 紀錄'));
  const ws2=XLSX.utils.aoa_to_sheet(buildPivotAOA(recs)); ws2['!cols']=wcol(34,[19,25]); colorHeader(ws2,COLOR_PIVOT); XLSX.utils.book_append_sheet(wb,ws2,nm('打卡紀錄'));
  const ws3=XLSX.utils.aoa_to_sheet(buildStatsAOA(recs)); ws3['!cols']=wcol(21,[]);      colorHeader(ws3,COLOR_STAT);  XLSX.utils.book_append_sheet(wb,ws3,nm('統計數據'));
  return wb;
}
function exportLogXlsx(){
  if(!records.length){ toast('沒有可匯出的紀錄'); return; }
  XLSX.writeFile(buildWorkbook(records),`打卡紀錄_${fmtDate(new Date()).replace(/\//g,'')}.xlsx`);
  toast('已匯出月報表（Log＋打卡紀錄＋統計）',true);
}
function exportByDept(){
  if(!records.length){ toast('沒有可匯出的紀錄'); return; }
  const groups=new Map();
  records.forEach(r=>{ const d=deptOf(r.empId)||'未分部門'; if(!groups.has(d)) groups.set(d,[]); groups.get(d).push(r); });
  const today=fmtDate(new Date()).replace(/\//g,'');
  let i=0, names=[...groups.keys()];
  const run=()=>{
    if(i>=names.length){ toast('已依部門匯出 '+names.length+' 個檔案',true); return; }
    const d=names[i++];
    XLSX.writeFile(buildWorkbook(groups.get(d)),`打卡紀錄_${d}_${today}.xlsx`);
    setTimeout(run,400);   // 間隔觸發，避免瀏覽器擋多檔下載
  };
  run();
}/* ===== ROSTER ===== */
function renderRoster(){
  document.getElementById('rosterCount').textContent=roster.length+' 人';
  const list=document.getElementById('rosterList');
  list.innerHTML=roster.length? roster.map(r=>`
    <div class="roster-item">
      <div class="avatar">${initials(r.name)}</div>
      <div class="meta"><b>${r.name}</b><span>${r.id}${r.dept?' · '+r.dept:''} · ${r.loc||'未設地點'} · ${r.shift||'固定班'}${r.hours?' · '+r.hours+'h':''}${r.gps?' · GPS '+r.gps:''}</span></div>
      <button class="icon-btn" data-edit="${r.id}" title="編輯">&#9998;</button>
      <button class="icon-btn" data-drm="${r.id}" title="刪除">&#10005;</button>
    </div>`).join('') : '<div class="empty">名單是空的。用上方表單新增，或用「匯入名單」從 Excel／CSV 載入。</div>';

  list.querySelectorAll('[data-drm]').forEach(b=>b.onclick=async()=>{
    roster=roster.filter(x=>x.id!==b.dataset.drm); await saveRoster();
    if(editingId===b.dataset.drm) resetForm();
    renderRoster();
  });
  list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>startEdit(b.dataset.edit));

  document.getElementById('rAdd').onclick=saveEmployee;
  document.getElementById('rCancel').onclick=resetForm;

  const imp=document.getElementById('rImportBtn'), file=document.getElementById('rImportFile');
  imp.onclick=()=>file.click();
  file.onchange=e=>{ const f=e.target.files[0]; if(f) importRosterFile(f); file.value=''; };

  const rCity=document.getElementById('rCity');
  if(rCity){
    rCity.innerHTML=cityOptions('縣市帶入…');
    rCity.onchange=()=>{ const c=cityLngLat(rCity.value); if(c) document.getElementById('rGps').value=c.lng+','+c.lat; };
  }
  refreshFormMode();
}
function fval(id){ return document.getElementById(id).value.trim(); }
function refreshFormMode(){
  const editing=!!editingId;
  document.getElementById('rFormTitle').textContent=editing?('編輯員工：'+editingId):'新增員工';
  document.getElementById('rAdd').textContent=editing?'儲存修改':'加入名單';
  document.getElementById('rCancel').style.display=editing?'':'none';
  document.getElementById('rId').readOnly=editing;
}
function resetForm(){
  editingId=null;
  ['rId','rName','rDept','rLoc','rGps','rHours'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('rShift').value='固定班';
  refreshFormMode();
}
function startEdit(id){
  const r=roster.find(x=>x.id===id); if(!r) return;
  editingId=id;
  document.getElementById('rId').value=r.id;
  document.getElementById('rName').value=r.name||'';
  document.getElementById('rDept').value=r.dept||'';
  document.getElementById('rLoc').value=r.loc||'';
  document.getElementById('rGps').value=r.gps||'';
  document.getElementById('rShift').value=r.shift||'固定班';
  document.getElementById('rHours').value=r.hours||'';
  refreshFormMode();
  document.getElementById('rName').focus();
}
async function saveEmployee(){
  const id=fval('rId'), name=fval('rName');
  if(!id||!name){ toast('請填員工編號與姓名'); return; }
  const data={id,name,dept:fval('rDept'),loc:fval('rLoc'),gps:fval('rGps'),shift:document.getElementById('rShift').value,hours:fval('rHours')};
  if(editingId){
    const i=roster.findIndex(x=>x.id===editingId);
    if(i>=0) roster[i]=data;
    await saveRoster(); resetForm(); renderRoster(); toast('已儲存修改',true);
  }else{
    if(roster.some(x=>x.id===id)){ toast('此員工編號已存在'); return; }
    roster.push(data); await saveRoster(); resetForm(); renderRoster(); toast('已加入 '+name,true);
  }
}
function pickField(row, keys){
  for(const k of Object.keys(row)){
    const kk=String(k).toLowerCase().replace(/\s/g,'');
    for(const want of keys){ if(kk.includes(want)) return row[k]; }
  }
  return '';
}
function importRosterFile(f){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      const list=[];
      rows.forEach(row=>{
        const id=String(pickField(row,['員工編號','工號','編號','empid','id'])||'').trim();
        const name=String(pickField(row,['姓名','name'])||'').trim();
        if(!id||!name) return;
        list.push({
          id, name,
          dept:String(pickField(row,['部門','dept'])||'').trim(),
          loc:String(pickField(row,['打卡地點','地點','location','loc'])||'').trim(),
          gps:String(pickField(row,['gps','座標'])||'').trim(),
          shift:(String(pickField(row,['班別','shift'])||'').trim())||'固定班',
          hours:String(pickField(row,['每日時數','時數','工時','hours'])||'').trim()
        });
      });
      if(!list.length){ toast('檔案裡找不到「員工編號 / 姓名」欄位'); return; }
      if(!confirm('將匯入 '+list.length+' 位員工，並「取代」目前名單（不影響打卡紀錄），確定嗎？')) return;
      roster=list; saveRoster(); resetForm(); renderRoster(); toast('已匯入 '+list.length+' 位員工',true);
    }catch(err){ toast('讀取檔案失敗，請確認是 Excel 或 CSV 檔'); }
  };
  reader.readAsArrayBuffer(f);
}
function normDate(v){
  if(v==null) return '';
  if(v instanceof Date) return v.getFullYear()+'/'+pad(v.getMonth()+1)+'/'+pad(v.getDate());
  const s=String(v).trim().replace(/-/g,'/');
  const m=s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  return m ? m[1]+'/'+pad(+m[2])+'/'+pad(+m[3]) : s;
}
function normTime(v){
  if(v==null) return '';
  if(v instanceof Date) return pad(v.getHours())+':'+pad(v.getMinutes());
  const m=String(v).trim().match(/(\d{1,2}):(\d{2})/);
  return m ? pad(+m[1])+':'+m[2] : String(v).trim();
}
function locToRec(locStr){
  const g=parseGps(locStr);
  if(g) return {loc:gpsString(g.lng,g.lat),method:'GPS',lat:g.lat,lng:g.lng};
  return {loc:String(locStr||'').trim(),method:'手動',lat:null,lng:null};
}
function importRecordsFile(f){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      let out=[];
      for(const sn of wb.SheetNames){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{raw:false,defval:''});
        if(!rows.length) continue;
        const keys=Object.keys(rows[0]).map(k=>String(k).replace(/\s/g,''));
        const hasCat=keys.some(k=>k.includes('類別'));
        const hasIn=keys.some(k=>k.includes('上班打卡時間'));
        const tmp=[];
        if(hasCat){
          rows.forEach(row=>{
            const id=String(pickField(row,['員工編號','工號','編號','empid','id'])||'').trim();
            const date=normDate(pickField(row,['打卡日期','日期','date']));
            const time=normTime(pickField(row,['打卡時間','時間','time']));
            const cat=String(pickField(row,['類別','cat'])||'').trim();
            if(!id||!date||!time||(cat!=='上班'&&cat!=='下班')) return;
            const L=locToRec(pickField(row,['打卡地點','地點','location','loc']));
            tmp.push({rid:uid(),empId:id,name:String(pickField(row,['姓名','name'])||'').trim(),
              date,time,cat,loc:L.loc,method:L.method,lat:L.lat,lng:L.lng,
              shift:(String(pickField(row,['班別','shift'])||'').trim())||'固定班'});
          });
        } else if(hasIn){
          rows.forEach(row=>{
            const id=String(pickField(row,['員工編號'])||'').trim();
            const name=String(pickField(row,['姓名'])||'').trim();
            const date=normDate(pickField(row,['打卡日期']));
            const shift=(String(pickField(row,['班別'])||'').trim())||'固定班';
            if(!id||!date) return;
            const inT=normTime(pickField(row,['上班打卡時間']));
            const outT=normTime(pickField(row,['下班打卡時間']));
            if(inT && inT!=='--'){ const L=locToRec(pickField(row,['上班打卡地點'])); tmp.push({rid:uid(),empId:id,name,date,time:inT,cat:'上班',loc:L.loc,method:L.method,lat:L.lat,lng:L.lng,shift}); }
            if(outT && outT!=='--'){ const L=locToRec(pickField(row,['下班打卡地點'])); tmp.push({rid:uid(),empId:id,name,date,time:outT,cat:'下班',loc:L.loc,method:L.method,lat:L.lat,lng:L.lng,shift}); }
          });
        }
        if(tmp.length){ out=tmp; break; }
      }
      if(!out.length){ toast('檔案裡找不到可辨識的打卡資料'); return; }
      if(!confirm('將匯入 '+out.length+' 筆打卡紀錄，並「取代」目前紀錄，確定嗎？')) return;
      records=out; saveRecords(); renderRecords(); toast('已匯入 '+out.length+' 筆打卡紀錄',true);
    }catch(err){ toast('讀取檔案失敗，請確認是 Excel 或 CSV 檔'); }
  };
  reader.readAsArrayBuffer(f);
}

  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); currentView=b.dataset.v; render();
});

loadAll(); render();
